<title>Reporting Handover</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout concept: a reference book. Sticky search bar, contents in a left margin, each chapter set as one paper page with a running head and folio. */
:root{
  --bg:#E7ECE9; --paper:#FBFCFB; --ink:#16211F; --muted:#566663; --rule:#CAD3CF;
  --accent:#0E5C54; --accent-ink:#FFFFFF; --accent-soft:#D6E9E5;
  --draft:#7A4E00; --draft-bg:#F7E9C8; --handed:#464C86; --handed-bg:#E4E5F5; --ref:#4F5B59; --ref-bg:#DFE6E3;
  --danger:#9B2C2C; --mark:#FFE79A;
  --f-display:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Source Serif 4',Georgia,'Times New Roman',serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1514; --paper:#162120; --ink:#E5EEEB; --muted:#93A6A2; --rule:#2B3A38;
    --accent:#62C4B6; --accent-ink:#07211D; --accent-soft:#1B3935;
    --draft:#F0C46A; --draft-bg:#3A2F14; --handed:#B4B8F0; --handed-bg:#272B4A; --ref:#A8B7B4; --ref-bg:#243130;
    --danger:#F19999; --mark:#6B5A12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1514; --paper:#162120; --ink:#E5EEEB; --muted:#93A6A2; --rule:#2B3A38;
  --accent:#62C4B6; --accent-ink:#07211D; --accent-soft:#1B3935;
  --draft:#F0C46A; --draft-bg:#3A2F14; --handed:#B4B8F0; --handed-bg:#272B4A; --ref:#A8B7B4; --ref-bg:#243130;
  --danger:#F19999; --mark:#6B5A12; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:96px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--rule);padding-block:12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"brand search btn";gap:10px 20px;align-items:center}
.brand{grid-area:brand;display:flex;flex-direction:column;line-height:1.15;text-decoration:none;color:var(--ink)}
.brand b{font:700 19px/1.1 var(--f-display);letter-spacing:-.01em}
.brand span{font:400 11.5px var(--f-mono);color:var(--muted);letter-spacing:.04em;margin-top:4px}
.search{grid-area:search;position:relative;max-width:560px;width:100%;justify-self:end}
.search input{width:100%;font:400 16px var(--f-display);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:10px 12px;appearance:none}
.search input::placeholder{color:var(--muted)}
.tocbtn{grid-area:btn;display:none;font:600 14px var(--f-display);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:10px 14px;cursor:pointer}
@media (max-width:899px){
  .top{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand btn" "search search"}
  .tocbtn{display:inline-block}
  .search{max-width:none;justify-self:stretch}
}

/* shell */
.shell{display:grid;grid-template-columns:276px minmax(0,1fr);gap:36px;padding-top:24px;align-items:start}
.toc{font-family:var(--f-display)}
@media (min-width:900px){
  .toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);max-height:calc(100vh - 110px);overflow:auto;padding-right:6px}
}
@media (max-width:899px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px}
  .toc{display:none;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:12px}
  .toc.open{display:block}
}
.toc h2{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 8px 6px}
.toc h2:first-child{margin-top:0}
.toc a{display:grid;grid-template-columns:26px minmax(0,1fr) 12px;align-items:center;gap:4px;padding:7px 8px;border-radius:4px;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.3}
.toc a:hover{background:var(--accent-soft)}
.toc a[aria-current="page"]{background:var(--accent-soft);font-weight:600}
.toc .n{font:400 12px var(--f-mono);color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;justify-self:end}
.d-active{background:var(--accent)} .d-handed{background:var(--handed)} .d-reference{background:var(--ref)}
.d-draft{border:2px solid var(--draft);background:transparent}
.legend{display:grid;gap:4px;margin:18px 8px 0;font:400 12px var(--f-display);color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.legend .dot{justify-self:auto}

/* page */
main{min-width:0;outline:none}
.page{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:22px clamp(18px,4vw,44px) 26px;box-shadow:0 14px 30px -26px rgba(0,0,0,.45);max-width:800px}
.runhead{display:flex;justify-content:space-between;align-items:center;gap:12px;font:500 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:12px;border-bottom:1px solid var(--rule)}
.rh-right{display:flex;align-items:center;gap:10px;min-width:0;text-align:right}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink);cursor:pointer;padding:0;flex:none}
.iconbtn:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.auto-hint{text-transform:none;letter-spacing:0;font:400 12.5px var(--f-display)}
.page h1{font:700 clamp(27px,4.4vw,38px)/1.12 var(--f-display);letter-spacing:-.02em;margin:26px 0 14px;text-wrap:balance}
.chip{font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:3px;display:inline-block;white-space:nowrap}
.s-active{background:var(--accent-soft);color:var(--accent)}
.s-handed{background:var(--handed-bg);color:var(--handed)}
.s-ref{background:var(--ref-bg);color:var(--ref)}
.s-draft{background:var(--draft-bg);color:var(--draft)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 24px;margin:0 0 22px;padding:14px 0;border-block:1px solid var(--rule)}
.meta div{min-width:0}
.meta dt{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.meta dd{margin:0;font:500 15px/1.4 var(--f-display)}
.meta dd small{display:block;font:400 13px var(--f-display);color:var(--muted)}
.intro{font-size:18.5px;margin:0 0 8px}
.sec{padding-top:22px;margin-top:22px;border-top:1px solid var(--rule)}
.sec h2,.block h2{font:600 19px/1.25 var(--f-display);letter-spacing:-.005em;margin:0 0 10px;text-wrap:balance}
.secnote{margin:0 0 10px;color:var(--muted);font-size:15.5px}
.page ul,.page ol{margin:0;padding-left:1.3em;display:grid;gap:8px}
.page li ul{margin-top:8px}
.steps li::marker{color:var(--accent);font:500 14px var(--f-mono)}
.list li::marker{color:var(--muted)}
.checks{list-style:none;padding-left:0 !important}
.checks label{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.checks input{width:19px;height:19px;margin:4px 0 0;flex:none;accent-color:var(--accent)}
.checks input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule)}
.tickbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:14px;font:400 13px var(--f-display);color:var(--muted)}
.linkbtn{font:500 13px var(--f-display);color:var(--accent);background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline}
.block{margin-top:26px;padding-top:22px;border-top:1px solid var(--rule)}
.files{list-style:none;padding:0 !important;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px !important}
.files li{display:flex;gap:10px;align-items:center;border:1px solid var(--rule);border-radius:4px;padding:10px 12px;min-width:0;font:500 14.5px/1.35 var(--f-display)}
.ft{font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--rule);border-radius:3px;padding:3px 5px;flex:none}
.files .nm{min-width:0;overflow-wrap:anywhere;flex:1}
.files .nm small{display:block;font:400 12.5px var(--f-display);color:var(--muted)}
.files .nolink{font:400 11.5px var(--f-mono);color:var(--draft);border:1px dashed var(--draft);border-radius:3px;padding:3px 6px;flex:none}
.callout{background:var(--accent-soft);border-radius:4px;padding:14px 16px;margin-top:14px;font-size:16.5px}
.callout b{display:block;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.todo{border:1.5px dashed var(--rule);border-radius:4px;padding:14px 16px;margin-top:14px}
.todo .chip{margin-bottom:8px}
.todo h3{font:600 16.5px var(--f-display);margin:0 0 4px}
.todo p{margin:0;color:var(--muted);font-size:15.5px}
.todo ul{margin-top:8px}
.tablewrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font:400 15px/1.4 var(--f-display)}
th{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:10px 12px 10px 0;border-bottom:1px solid var(--rule);vertical-align:top}
td .add{color:var(--draft);font:400 12px var(--f-mono)}
.rhythm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px 20px;margin-top:20px}
.rhythm h2{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.rhythm .ri{display:block;padding:9px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink);font:500 15px/1.3 var(--f-display)}
.rhythm .ri:hover{color:var(--accent)}
.rhythm .ri small{display:block;font:400 13px var(--f-display);color:var(--muted);margin-top:2px}
.rhythm .ri .chip{margin-top:6px}
.rhythm .none{font:400 14px var(--f-display);color:var(--muted);margin:0}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px;padding-top:18px;border-top:1px solid var(--rule)}
.pager a{display:block;text-decoration:none;color:var(--ink);padding:10px 12px;border:1px solid var(--rule);border-radius:4px;font:600 15px/1.3 var(--f-display);min-width:0}
.pager a:hover{background:var(--accent-soft)}
.pager a small{display:block;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.pager .next{text-align:right;grid-column:2}
.folio{text-align:center;font:400 13px var(--f-mono);color:var(--muted);margin-top:18px}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}

/* forms and buttons */
.field{display:grid;gap:6px;margin-top:16px;min-width:0}
.field label,.field legend{font:600 13.5px var(--f-display)}
.field .hint{font:400 13px/1.4 var(--f-display);color:var(--muted)}
.field input[type=text],.field select,.field textarea,.inline input[type=text],.inline select{width:100%;font:400 16px/1.45 var(--f-display);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:9px 11px;min-width:0}
.field textarea{font:400 14.5px/1.5 var(--f-mono);resize:vertical;min-height:90px}
.field textarea.tall{min-height:260px}
.fieldrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 18px}
fieldset.field{border:0;padding:0;margin:16px 0 0}
.cad{display:flex;flex-wrap:wrap;gap:8px 14px}
.cad label{font:400 14.5px var(--f-display);display:flex;gap:7px;align-items:center}
.cad input{width:17px;height:17px;accent-color:var(--accent)}
.guide{margin-top:8px;font:400 13.5px var(--f-display);color:var(--muted)}
.guide summary{cursor:pointer;color:var(--accent);font-weight:500}
.guide pre{margin:8px 0 0;padding:10px 12px;background:var(--bg);border:1px solid var(--rule);border-radius:4px;overflow-x:auto;font:400 13px/1.55 var(--f-mono);color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}
.btn{font:600 14.5px var(--f-display);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:9px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{color:var(--accent-ink);filter:brightness(1.08)}
.btn.small{font-size:13px;padding:5px 9px}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.btn[disabled]{opacity:.4;cursor:default}
.btn[disabled]:hover{border-color:var(--rule);color:var(--ink)}
.inline{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) auto;gap:10px;align-items:end;margin-top:12px}
@media (max-width:640px){.inline{grid-template-columns:minmax(0,1fr)}}
.inline label{display:block;font:600 13.5px var(--f-display);margin-bottom:6px}
.notice{margin:0 0 6px;padding:10px 12px;border-radius:4px;background:var(--accent-soft);font:500 14.5px/1.4 var(--f-display)}
.notice.warn{background:var(--draft-bg);color:var(--draft)}
.pl{list-style:none;padding:0 !important;gap:0 !important;margin-top:8px !important}
.pl li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule);font:500 15px/1.3 var(--f-display)}
.pl .n{font:400 12px var(--f-mono);color:var(--muted)}
.pl a{color:var(--ink);text-decoration:none;min-width:0;overflow-wrap:anywhere}
.pl a:hover{color:var(--accent)}
.pl .btns{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.pl h3{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 0}
.backup textarea{font:400 12.5px/1.45 var(--f-mono);min-height:120px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 14px;align-items:end;border:1px solid var(--rule);border-radius:4px;padding:12px;margin-top:10px}
.frow .fl{display:grid;gap:6px;font:600 13px var(--f-display);min-width:0}
.frow .fl.wide{grid-column:1/-1}
.frow input,.frow select{width:100%;font:400 15.5px var(--f-display);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:8px 10px;min-width:0}
.frow .btn{justify-self:start}

/* search results */
.results{max-width:800px}
.results .head{font:600 18px/1.3 var(--f-display);margin:0 0 4px}
.results .also{font:400 14px var(--f-display);color:var(--muted);margin:0 0 14px}
.hit{display:block;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:14px 16px;margin-bottom:10px}
.hit:hover{border-color:var(--accent)}
.hit .where{font:500 11.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.hit .ttl{font:600 17px/1.3 var(--f-display);margin:3px 0 4px}
.hit p{margin:0;font-size:15.5px;color:var(--ink)}
mark{background:var(--mark);color:var(--ink);border-radius:2px;padding:0 1px}
.empty{background:var(--paper);border:1px dashed var(--rule);border-radius:4px;padding:18px 16px}
</style>

<div class="wrap">
  <header class="top">
    <a class="brand" href="#start" id="brand"><b>Reporting handover</b><span>Draft structure, content in progress</span></a>
    <div class="search"><input id="q" type="search" autocomplete="off" aria-label="Search the handover" placeholder="Search, e.g. “late report” or “overtime hours”"></div>
    <button class="tocbtn" id="tocbtn" type="button" aria-expanded="false" aria-controls="toc">Contents</button>
  </header>
  <div class="shell">
    <nav class="toc" id="toc" aria-label="Contents"></nav>
    <main id="main" tabindex="-1"></main>
  </div>
</div>

/* ---------- tidy any page object ---------- */
const safeLink=l=>/^https?:\/\//i.test(String(l||'').trim())?String(l).trim().slice(0,1000):'';
function normPage(p,id,group){
  const S=v=>typeof v==='string'?v.slice(0,6000):'';
  const A=v=>Array.isArray(v)?v:[];
  p=p&&typeof p==='object'?p:{};
  const o={id:id,group:group,title:S(p.title).trim()||'Untitled page',status:STATUS[p.status]?p.status:'active',
    when:S(p.when),slot:S(p.slot),reviewed:S(p.reviewed),intro:S(p.intro)};
  o.cadence=A(p.cadence).filter(k=>COLS.some(c=>c[0]===k));
  if(group==='chapter'&&!o.cadence.length)o.cadence=['tbc'];
  o.tags=A(p.tags).map(S).map(t=>t.trim()).filter(Boolean).slice(0,40);
  o.prompts=A(p.prompts).map(S).filter(Boolean).slice(0,10);
  o.sections=A(p.sections).slice(0,60).map(s=>{s=s||{};return {h:S(s.h),kind:KINDS.indexOf(s.kind)>=0?s.kind:'bullets',note:S(s.note),
    items:A(s.items).slice(0,300).map(it=>{if(typeof it==='string')return S(it);const sub=A(it&&it.sub).map(S);return sub.length?{t:S(it&&it.t),sub:sub}:S(it&&it.t)})}});
  o.files=A(p.files).map(f=>{f=f||{};return {name:S(f.name).trim(),type:TYPE[f.type]?f.type:'file',note:S(f.note),link:safeLink(f.link)}}).filter(f=>f.name);
  o.notes=A(p.notes).map(S).map(t=>t.trim()).filter(Boolean);
  o.contacts=A(p.contacts).map(x=>({name:S(x&&x.name).trim(),why:S(x&&x.why).trim()})).filter(x=>x.name);
  return o;
}

let PAGES=[];
function computePages(){
  const list=[];
  BASE.forEach(b=>{
    const o=overrides[b.id]||{};if(o.deleted)return;
    let src=b;
    if(o.page){src=normPage(Object.assign({},b,o.page),b.id,b.group);if(b.auto)src.auto=b.auto;if(b.extra)src.extra=b.extra}
    list.push(Object.assign({},src,{order:typeof o.order==='number'?o.order:b.order}));
  });
  Object.keys(overrides).forEach(id=>{
    if(BASE_IDS[id])return;const o=overrides[id];if(!o||o.deleted||!o.page)return;
    const g=GROUP_RANK[o.page.group]!=null?o.page.group:'chapter';
    list.push(Object.assign(normPage(o.page,id,g),{order:typeof o.order==='number'?o.order:9999}));
  });
  list.sort((a,b)=>GROUP_RANK[a.group]-GROUP_RANK[b.group]||a.order-b.order);
  PAGES=list;
}

async function setOverride(id,patch){
  await storeReady;
  const next=Object.assign({},overrides[id]||{});
  Object.keys(patch).forEach(k=>{if(patch[k]===undefined||patch[k]===null)delete next[k];else next[k]=patch[k]});
  if(next.deleted===false)delete next.deleted;
  const empty=!('page' in next)&&!('order' in next)&&!next.deleted;
  if(store.mode==='shared'){
    const ref=db.collection('pages').doc(id);
    if(empty)await ref.delete();else await ref.set(clone(next));
  }
  if(empty)delete overrides[id];else overrides[id]=next;
  if(store.mode!=='shared'&&!saveLocal())throw {code:'storage'};
}

/* ---------- text <-> sections ---------- */
function bodyToText(sections){
  return sections.map(s=>{
    let t='## '+s.h;
    if(s.note)t+='\n'+s.note;
    s.items.forEach((it,i)=>{
      const text=typeof it==='string'?it:it.t;
      const pre=s.kind==='checks'?'[ ] ':s.kind==='steps'?(i+1)+'. ':s.kind==='terms'?'= ':'- ';
      t+='\n'+pre+text;
      (typeof it==='string'?[]:(it.sub||[])).forEach(x=>{t+='\n  - '+x});
    });
    return t;
  }).join('\n\n');
}
function textToBody(txt){
  const secs=[];let cur=null;
  const start=h=>{cur={h:h,kind:null,note:'',items:[]};secs.push(cur)};
  String(txt).split('\n').forEach(raw=>{
    const line=raw.replace(/\s+$/,'');if(!line.trim())return;
    let m=line.match(/^##\s*(.*)$/);
    if(m){start(m[1].trim());return}
    if(!cur)start('');
    m=line.match(/^(?:\s{2,}|\t)[-*]\s+(.*)$/);
    if(m&&cur.items.length){
      const last=cur.items[cur.items.length-1];
      if(typeof last==='string')cur.items[cur.items.length-1]={t:last,sub:[m[1].trim()]};else last.sub.push(m[1].trim());
      return;
    }
    const t=line.trim();let kind=null,text=t;
    if(m=t.match(/^\[[ xX]?\]\s*(.*)$/)){kind='checks';text=m[1]}
    else if(m=t.match(/^\d+[.)]\s+(.*)$/)){kind='steps';text=m[1]}
    else if(m=t.match(/^=\s*(.*)$/)){kind='terms';text=m[1]}
    else if(m=t.match(/^[-*•]\s+(.*)$/)){kind='bullets';text=m[1]}
    if(kind===null){
      if(!cur.items.length){cur.note=(cur.note?cur.note+' ':'')+t;return}
      kind=cur.kind||'bullets';
    }
    if(!cur.kind)cur.kind=kind;
    else if(kind!==cur.kind){start('');cur.kind=kind}
    cur.items.push(text);
  });
  secs.forEach(s=>{if(!s.kind)s.kind='bullets'});
  return secs;
}
function filesToText(files){return files.map(f=>{const a=[f.type,f.name,f.note,f.link];while(a.length>2&&!a[a.length-1])a.pop();return a.join(' | ')}).join('\n')}
function textToFiles(txt){
  return String(txt).split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split('|').map(x=>x.trim());let type;
    if(p.length>=2&&TYPE[p[0].toLowerCase()]){type=p.shift().toLowerCase()}
    else{const ext=(p[0].match(/\.(xlsx|pptx|docx|pdf)$/i)||[])[1];type=ext?ext.toLowerCase():(/\.[a-z0-9]{2,4}$/i.test(p[0])?'file':'folder')}
    return {name:p[0]||'',type:type,note:p[1]||'',link:p[2]||''};
  }).filter(f=>f.name);
}

function buildToc(){

  };

  $('#toc').innerHTML='<h2>Front</h2>'+grp('front')+'<h2>Chapters</h2>'+grp('chapter')+'<h2>Back</h2>'+grp('back')+
    '<div class="legend" aria-label="Status key">'+Object.keys(STATUS).map(k=>`<span><i class="dot d-${k}"></i>${STATUS[k].label}</span>`).join('')+'</div>';
}
function shell(p,inner,opts){
  opts=opts||{};
  const i=PAGES.indexOf(p),prev=PAGES[i-1],next=PAGES[i+1];
  const total=chapters().length;
  const run=p.group==='chapter'?'Chapter '+chNum(p)+' of '+total:GROUP_LABEL[p.group];
  let right;
  if(opts.editing)right='<span>Editing</span>';
  else if(p.auto==='functions')right='<span>'+esc(run)+'</span>';
  else if(p.auto)right='<span>'+esc(run)+'</span><span class="auto-hint">Built from the chapters</span>';
  else right='<span>'+esc(run)+'</span><button type="button" class="iconbtn" data-act="edit" aria-label="Edit this page" title="Edit this page">'+ICON+'</button>';
  const pager=opts.editing?'':'<nav class="pager" aria-label="Previous and next page">'+
    (prev?`<a class="prev" href="#${prev.id}"><small>Previous</small>${esc(prev.title)}</a>`:'<span></span>')+
    (next?`<a class="next" href="#${next.id}"><small>Next</small>${esc(next.title)}</a>`:'')+'</nav>';
  const folio=p.group==='chapter'&&!opts.editing?`<div class="folio">${chNum(p)}</div>`:'';
  return `<article class="page"><div class="runhead"><span>Reporting handover</span><span class="rh-right">${right}</span></div>${inner}${pager}${folio}</article>`;
}
function todoBox(title,text,list,tag){
  return `<div class="todo"><span class="chip s-draft">${tag||'To add'}</span><h3>${esc(title)}</h3>${text?`<p>${esc(text)}</p>`:''}${list&&list.length?'<ul>'+list.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}</div>`;
}
function section(p,s,si){
  const key=p.id+'-'+si;
  if(!s.items.length)return `<section class="sec" id="sec-${si}">${todoBox(s.h||'Section',s.note||'')}</section>`;
  let body;
  if(s.kind==='checks'){
    body='<ul class="checks">'+s.items.map((it,i)=>{const k=key+'-'+i;
      return `<li><label><input type="checkbox" data-tick="${k}"${ticks[k]?' checked':''}><span>${li(it)}</span></label></li>`}).join('')+'</ul>';
  }else if(s.kind==='steps'){
    body='<ol class="steps">'+s.items.map(it=>`<li>${li(it)}</li>`).join('')+'</ol>';
  }else if(s.kind==='terms'){
    body='<div class="tablewrap"><table><thead><tr><th>Term</th><th>Meaning</th></tr></thead><tbody>'+s.items.map(it=>{
      const t=itemText(it),i=t.indexOf('|'),term=i<0?t:t.slice(0,i).trim(),mean=i<0?'':t.slice(i+1).trim();
      return `<tr><td><b>${esc(term)}</b></td><td>${mean?esc(mean):'<span class="add">definition to add</span>'}</td></tr>`}).join('')+'</tbody></table></div>';
  }else{

  }

}
function fileList(files){

                 :`<li>${t}<span class="nm">${esc(f.name)}${sm}</span><span class="nolink">link to add</span></li>`}).join('')+'</ul>';

/* ---------- page renderers ---------- */
function contentPage(p){

     <div><dt>Last reviewed</dt><dd>${p.reviewed?esc(p.reviewed):'<small>Not set</small>'}</dd></div>
     <div><dt>Contacts</dt><dd>${contacts}</dd></div></dl>`;
  }
  if(p.intro)h+=`<p class="intro">${esc(p.intro)}</p>`;
  if(isCh&&p.status==='draft'&&!p.sections.length)h+=todoBox('This chapter is not written yet','Suggested headings to cover:',p.prompts,'To write');
  p.sections.forEach((s,i)=>{h+=section(p,s,i)});
  if(p.sections.some(s=>s.kind==='checks'&&s.items.length))h+=`<div class="tickbar"><span>Ticks are saved on this device only.</span><button type="button" class="linkbtn" data-clear="${esc(p.id)}">Clear ticks</button></div>`;

  if(empty)h+=todoBox('This page is empty','Use the pencil icon at the top of the page to add content.');

}
function progressBlock(){
  const chs=chapters(),files=[].concat.apply([],chs.map(c=>c.files));
  const written=chs.filter(c=>c.status!=='draft'),linked=files.filter(f=>f.link).length,reviewed=written.filter(c=>c.reviewed).length;
  const drafts=chs.filter(c=>c.status==='draft');
  return `<div class="block"><h2>Handover progress</h2><div class="tablewrap"><table><thead><tr><th>Item</th><th>Done</th></tr></thead><tbody>
   <tr><td>Chapters written</td><td>${written.length} of ${chs.length}</td></tr>
   <tr><td>Files with a link</td><td>${linked} of ${files.length}</td></tr>
   <tr><td>Chapters with a review date</td><td>${reviewed} of ${written.length}</td></tr></tbody></table></div>
   ${drafts.length?'<p class="secnote" style="margin-top:12px">Still to write: '+drafts.map(d=>`<a href="#${d.id}">${esc(d.title)}</a>`).join(', ')+'.</p>':''}</div>`;
}
function rhythmPage(p){

      :`<p class="none">${k==='wed'||k==='thu'?'Nothing logged yet':'Nothing'}</p>`;

function filesPage(p){

    <div class="inline"><div><label for="new-title">Title</label><input id="new-title" type="text" maxlength="120" placeholder="e.g. Month-end close"></div>
     <div><label for="new-group">Where</label><select id="new-group"><option value="chapter">Chapter (a task or report)</option><option value="front">Front matter</option><option value="back">Back matter</option></select></div>

  if(removed.length)h+=`<section class="sec"><h2>Removed pages</h2><ul class="pl">${removed.map(r=>`<li><span class="n"></span><span>${esc(r.title)}</span><span class="btns"><button type="button" class="btn small" data-act="restore" data-id="${esc(r.id)}">Restore</button></span></li>`).join('')}</ul></section>`;
  h+=`<section class="sec backup"><h2>Backup</h2><p class="secnote">Every edit, order change and added page as text. Keep a copy somewhere safe, or paste one below to restore it.</p>

function collectEdit(p){
  const v=id=>{const e=$('#'+id);return e?e.value:''};
  const isCh=p.group==='chapter';
  const np=Object.assign({},p,{title:v('ed-title').trim()||p.title,intro:v('ed-intro').trim(),
    sections:textToBody(v('ed-body')),
    notes:v('ed-notes').split(/\n\s*\n/).map(t=>t.trim()).filter(Boolean),
    files:filesFromForm(),contacts:textToContacts(v('ed-contacts'))});
  if(isCh){
    np.status=v('ed-status');np.when=v('ed-when').trim();np.slot=v('ed-slot').trim();np.reviewed=v('ed-reviewed').trim();
    np.cadence=$$('input[name=cad]:checked',main).map(i=>i.value);
    np.tags=v('ed-tags').split(',').map(t=>t.trim()).filter(Boolean);

/* ---------- show, route ---------- */
const main=$('#main'),q=$('#q');
let current='start',pendingSec=null,editing=null;
function pageHtml(p){
  if(editing&&editing.id===p.id&&!p.auto)return editorPage(p);
  if(p.auto==='rhythm')return rhythmPage(p);
  if(p.auto==='people')return peoplePage(p);
  if(p.auto==='files')return filesPage(p);
  if(p.auto==='functions')return functionsPage(p);
  return contentPage(p);
}
function show(id,sec,keep){
  const p=byId(id)||byId('start')||PAGES[0];current=p.id;
  main.innerHTML=pageHtml(p);
  $$('#toc a').forEach(a=>{a.getAttribute('data-id')===p.id?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
  if(keep)return;
  main.focus({preventScroll:true});
  const el=sec!=null&&sec>=0?$('#sec-'+sec):null;
  if(el){el.scrollIntoView();el.classList.add('flash')}else window.scrollTo(0,0);
}
function closeToc(){$('#toc').classList.remove('open');$('#tocbtn').setAttribute('aria-expanded','false')}
function goTo(id,sec){
  q.value='';closeToc();
  if(location.hash==='#'+id){show(id,sec)}else{pendingSec=sec==null?null:sec;location.hash=id}
}
function route(){
  const id=decodeURIComponent(location.hash.slice(1));
  q.value='';closeToc();
  if(editing&&editing.id!==id)editing=null;
  notice='';armed=null;
  const s=pendingSec;pendingSec=null;
  show(byId(id)?id:'start',s);
}
window.addEventListener('hashchange',route);
function refreshAll(){
  computePages();buildToc();buildIndex();
  const ae=document.activeElement;
  if(ae&&main.contains(ae)&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return;
  if(q.value.trim()){renderSearch(q.value.trim());return}
  if(editing&&byId(editing.id)){$$('#toc a').forEach(a=>{a.getAttribute('data-id')===current?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});return}
  show(byId(current)?current:'start',null,true);
}

/* ---------- actions ---------- */
function failMessage(e){
  if(e&&e.code==='storage')return 'This browser blocked saving, so the change was not kept.';
  if(e&&(e.code==='invalid_argument'||e.code==='not_granted'))return 'This page is view-only for you, so the change was not saved. Ask the owner for Contributor access.';
  if(e&&e.code==='quota_exceeded')return 'The page store is full, so the change was not saved.';
  return 'The change could not be saved. Try again in a moment.';
}
async function run(fn,okText){
  try{await fn();if(okText)say(okText,false);return true}
  catch(e){say(failMessage(e),true);return false}
}
const slug=t=>('p-'+(t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,36)||'page')+'-'+Math.random().toString(36).slice(2,6));
async function addPage(){
  const title=($('#new-title')||{value:''}).value.trim(),group=($('#new-group')||{value:'chapter'}).value;
  if(!title){say('Give the page a title first.',true);show(current,null,true);return}
  const id=slug(title),same=PAGES.filter(x=>x.group===group);
  const order=(same.reduce((m,x)=>Math.max(m,x.order),group==='chapter'?90:group==='front'?0:880))+10;
  const raw=group==='chapter'?{title:title,status:'draft',when:'To confirm',cadence:['tbc'],
    prompts:['What it is and who it is for','When it needs doing and by whom','Where the files live','The steps, in order','Who to ask if it breaks']}:{title:title};
  const ok=await run(()=>setOverride(id,{page:normPage(raw,id,group),order:order}));
  if(!ok){show(current,null,true);return}
  computePages();buildToc();buildIndex();
  editing={id:id};say('Page added. Fill it in below.',false);
  goTo(id);
}
async function move(id,dir){
  const p=byId(id);if(!p)return;
  const same=PAGES.filter(x=>x.group===p.group),i=same.indexOf(p),o=same[i+dir];if(!o)return;
  let a=p.order,b=o.order;if(a===b)b=a+(dir>0?1:-1);
  const ok=await run(async()=>{await setOverride(p.id,{order:b});await setOverride(o.id,{order:a})});
  if(ok)say('Order changed.',false);
  computePages();buildToc();buildIndex();show(current,null,true);
}
async function removePage(id){
  if(armed!==id){armed=id;show(current,null,true);return}
  armed=null;const p=byId(id),t=p?p.title:'Page';
  const ok=await run(()=>setOverride(id,{deleted:true}),'“'+t+'” was removed. You can restore it below.');
  computePages();buildToc();buildIndex();show(current,null,true);
}
async function restorePage(id){
  await run(()=>setOverride(id,{deleted:false}),'Page restored.');
  computePages();buildToc();buildIndex();show(current,null,true);
}
async function savePage(){
  const p=byId(editing&&editing.id);if(!p)return;
  const np=collectEdit(p),dropped=droppedLinks;
  const ok=await run(()=>setOverride(p.id,{page:np}),'Saved.');
  if(ok){editing=null;if(dropped)say('Saved, but '+dropped+(dropped===1?' link was':' links were')+' not kept. Links must start with https.',true)}
  computePages();buildToc();buildIndex();show(current,null,true);
}
async function resetPage(){
  const p=byId(editing&&editing.id);if(!p)return;
  const ok=await run(()=>setOverride(p.id,{page:null}),'Page reset to the starting content.');
  if(ok)editing=null;
  computePages();buildToc();buildIndex();show(current,null,true);
}
async function importBackup(){
  const raw=($('#bk-in')||{value:''}).value.trim();
  if(!raw){say('Paste a copy into the box first.',true);show(current,null,true);return}
  let o;try{o=JSON.parse(raw)}catch(e){say('That is not a valid copy. Nothing was changed.',true);show(current,null,true);return}
  if(!o||typeof o!=='object'||Array.isArray(o)){say('That is not a valid copy. Nothing was changed.',true);show(current,null,true);return}
  let n=0,ok=true;
  for(const id of Object.keys(o)){
    if(!/^[A-Za-z0-9_-]{1,80}$/.test(id))continue;
    const v=o[id];if(!v||typeof v!=='object')continue;
    const patch={};
    if(v.page&&typeof v.page==='object'){const g=BASE_IDS[id]?BASE.find(b=>b.id===id).group:(GROUP_RANK[v.page.group]!=null?v.page.group:'chapter');patch.page=normPage(v.page,id,g)}
    if(typeof v.order==='number')patch.order=v.order;
    patch.deleted=v.deleted===true?true:false;
    ok=await run(()=>setOverride(id,patch));
    if(!ok)break;n++;
  }
  if(ok)say('Restored '+n+(n===1?' page.':' pages.'),false);
  computePages();buildToc();buildIndex();show(current,null,true);
}

document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]');
  if(a){
    const id=a.getAttribute('href').slice(1);
    if(byId(id)){e.preventDefault();goTo(id,a.dataset.sec!=null?parseInt(a.dataset.sec,10):null);return}
  }
  const clr=e.target.closest('[data-clear]');
  if(clr){
    const id=clr.getAttribute('data-clear');
    Object.keys(ticks).forEach(k=>{if(k.indexOf(id+'-')===0)delete ticks[k]});saveTicks();
    $$('input[data-tick]',main).forEach(i=>{i.checked=false});return;
  }
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.getAttribute('data-act'),id=b.getAttribute('data-id');
  if(act==='edit'){editing={id:current};notice='';show(current,null)}
  else if(act==='edit-page'){editing={id:id};notice='';goTo(id)}
  else if(act==='cancel'){editing=null;notice='';show(current,null)}
  else if(act==='add-file'){
    const l=$('#ed-files-list');if(!l)return;
    l.insertAdjacentHTML('beforeend',fileRow({type:'xlsx',name:'',note:'',link:''}));
    const n=l.querySelectorAll('.frow');const i=n[n.length-1].querySelector('[data-f="name"]');if(i)i.focus();
  }
  else if(act==='drop-file'){const r=b.closest('.frow');if(r)r.remove()}
  else if(act==='save')savePage();
  else if(act==='reset')resetPage();
  else if(act==='add')addPage();
  else if(act==='up')move(id,-1);
  else if(act==='down')move(id,1);
  else if(act==='del')removePage(id);
  else if(act==='restore')restorePage(id);
  else if(act==='import')importBackup();
  else if(act==='copy'){
    const t=$('#bk-out');if(!t)return;
    const fallback=()=>{t.focus();t.select();say('Copy failed. The text is selected, so press copy on your keyboard.',true);};
    try{navigator.clipboard.writeText(t.value).then(()=>{say('Copied.',false);show(current,null,true)},fallback)}catch(err){fallback()}
  }
});
main.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches&&t.matches('input[data-tick]')){if(t.checked)ticks[t.dataset.tick]=1;else delete ticks[t.dataset.tick];saveTicks()}
});

/* ---------- search ---------- */
let INDEX=[];
function buildIndex(){
  INDEX=[];
  PAGES.forEach(c=>{
    if(c.auto)return;
    INDEX.push({c:c,sec:-1,title:c.title,heading:'',tags:c.tags.join(' '),
      body:[c.when,c.intro,c.notes.join(' '),c.contacts.map(x=>x.name+' '+x.why).join(' '),c.files.map(f=>f.name+' '+f.note).join(' '),c.group==='chapter'?STATUS[c.status].label:''].join(' '),
      lines:[c.intro].concat(c.notes,[c.when]).filter(Boolean)});
    c.sections.forEach((s,si)=>INDEX.push({c:c,sec:si,title:c.title,heading:s.h,tags:'',body:[s.note].concat(s.items.map(itemText)).join(' '),lines:[s.note].concat(s.items.map(itemText)).filter(Boolean)}));
  });
}
function groupsFor(text){
  const terms=text.toLowerCase().replace(/[“”"']/g,' ').split(/\s+/).filter(t=>t&&!STOP.has(t)&&t.length>1);
  return terms.map(t=>{const s=stem(t);const syn=SYN[t]||SYN[s]||[];return Array.from(new Set([s].concat(syn)))});
}
function scoreEntry(e,groups){
  const T=e.title.toLowerCase(),H=e.heading.toLowerCase(),G=e.tags.toLowerCase(),B=e.body.toLowerCase();
  let matched=0,total=0;
  groups.forEach(g=>{
    let best=0;
    g.forEach((v,i)=>{const m=i===0?1:.5;let s=0;
      if(T.includes(v))s=Math.max(s,5*m);if(H.includes(v))s=Math.max(s,3*m);if(G.includes(v))s=Math.max(s,4*m);if(B.includes(v))s=Math.max(s,m);
      best=Math.max(best,s)});
    if(best>0){matched++;total+=best}
  });
  return {matched:matched,total:total};
}
function hl(text,variants){
  const vs=variants.slice().sort((a,b)=>b.length-a.length).map(v=>v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if(!vs.length)return esc(text);
  return text.split(new RegExp('('+vs.join('|')+')','gi')).map((p,i)=>i%2?'<mark>'+esc(p)+'</mark>':esc(p)).join('');
}
function snippet(e,variants){
  const low=variants.map(v=>v.toLowerCase());
  let line=e.lines.find(l=>low.some(v=>l.toLowerCase().includes(v)))||e.lines[0]||'';
  if(line.length>180){
    const idx=Math.max(0,Math.min.apply(null,low.map(v=>line.toLowerCase().indexOf(v)).filter(i=>i>=0).concat([0]))-50);
    line=(idx>0?'…':'')+line.slice(idx,idx+180)+'…';
  }
  return line;
}
function renderSearch(text){
  const groups=groupsFor(text);
  if(!groups.length){show(current);return}
  const scored=INDEX.map(e=>Object.assign({e:e},scoreEntry(e,groups))).filter(r=>r.matched>0);
  const best=scored.reduce((m,r)=>Math.max(m,r.matched),0);
  const hits=scored.filter(r=>r.matched===best).sort((a,b)=>b.total-a.total).slice(0,14);
  const all=[].concat.apply([],groups);
  const extra=[];groups.forEach(g=>g.slice(1).forEach(v=>{if(extra.indexOf(v)<0)extra.push(v)}));
  let h='<div class="results">';
  if(!hits.length){
    h+=`<div class="empty"><p class="head">Nothing in the handover matches “${esc(text)}”</p><p class="also" style="margin:6px 0 0">Try a different word. If this topic matters, it is a gap to add to the book.</p></div>`;
  }else{
    h+=`<p class="head">${hits.length} ${hits.length===1?'place':'places'} for “${esc(text)}”</p>`;
    h+=`<p class="also">${extra.length?'Also looked for: '+esc(extra.slice(0,8).join(', '))+'.':'Showing the best matches.'}</p>`;
    h+=hits.map(r=>{const e=r.e;
      return `<a class="hit" href="#${esc(e.c.id)}" data-sec="${e.sec}"><div class="where">${esc(label(e.c))}${e.heading?' · '+hl(e.heading,all):''}</div><div class="ttl">${hl(e.c.title,all)}</div><p>${hl(snippet(e,all),all)}</p></a>`}).join('');
  }
  main.innerHTML=h+'</div>';
  window.scrollTo(0,0);
}
q.addEventListener('input',()=>{const v=q.value.trim();if(v)renderSearch(v);else show(current)});
q.addEventListener('keydown',e=>{if(e.key==='Escape'){q.value='';show(current)}});

let resolveStore;const storeReady=new Promise(r=>{resolveStore=r});
computePages();buildToc();buildIndex();route();
(async function(){
  let timer=null;
  try{
    if(!window.claude||typeof window.claude.use!=='function')throw new Error('none');
    const d=await window.claude.use('db');
    if(!d)throw new Error('none');
    db=d;store.mode='shared';
    timer=setTimeout(()=>{store.slow=true;if(current==='functions')refreshAll()},10000);
    db.collection('pages').onSnapshot(snap=>{
      const o={};snap.docs.forEach(x=>{const v=x.data();if(v)o[x.id]=v});
      overrides=o;
      if(!snap.metadata.fromCache){store.slow=false;clearTimeout(timer)}
      refreshAll();
    },err=>{store.note='Shared edits are not available right now.';clearTimeout(timer);refreshAll()});
  }catch(e){
    store.mode='device';loadLocal();
  }
  resolveStore();
  refreshAll();
})();
})();
